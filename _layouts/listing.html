---
layout: default
---
<section class="container-fluid">
  {% if cards %}
  <ul class="col-md-8">
  {% else %}
  <ul class="offset-md-2 col-md-8">
  {% endif %}
    {{ content }}
  </ul>
  {% if cards %}
  <div class="col-md-4">
    {% for card in cards %}
    {% capture incl %}cards/{{ card }}.html{% endcapture %}
    {% include {{incl}} %}
    {% endfor %}
  </div>
  {% endif %}
</section>
